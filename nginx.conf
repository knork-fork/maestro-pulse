server {
    listen 20444;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin for the browser; the API is not published to the host itself.
    location /api/ {
        proxy_pass http://api:20445;
        proxy_http_version 1.1;
        # $host strips the port; $http_host is the Host header verbatim —
        # the api container needs the port back to build a working URL for
        # getAddToBacklogSkill.
        proxy_set_header Host $http_host;
    }

    # The add-to-backlog skill text, fetched directly by an external Claude
    # Code session — not part of the SPA's own API prefix.
    location /skills/ {
        proxy_pass http://api:20445;
        proxy_http_version 1.1;
        # $host strips the port; $http_host is the Host header verbatim —
        # the api container needs the port back to build a working URL for
        # getAddToBacklogSkill.
        proxy_set_header Host $http_host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
