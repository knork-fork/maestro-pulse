server {
    listen 20444;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin for the browser; the API is not published to the host itself.
    location /api/ {
        proxy_pass http://api:20445;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
